name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest

  import-guard:
    # Exports the committed tree (git archive HEAD) and runs `import app.wsgi`
    # from it, so a committed caller depending on an uncommitted/undeclared
    # symbol fails here instead of silently rolling back the production deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: import app.wsgi from clean committed checkout
        run: |
          python scripts/check_clean_import.py

  migrations:
    # Runs the real Alembic chain on a clean Postgres so duplicate-index / chain
    # issues surface here (the create_all-based unit tests cannot catch them, and
    # this mirrors the production release migration).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eqms
          POSTGRES_PASSWORD: eqms
          POSTGRES_DB: eqms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eqms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENV: ci
      SECRET_KEY: ci-secret
      STORAGE_BACKEND: local
      DATABASE_URL: postgresql://eqms:eqms@localhost:5432/eqms_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: alembic upgrade head (clean Postgres)
        run: |
          python -m alembic upgrade head
          python -m alembic current
